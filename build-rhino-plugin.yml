name: Rhino Context Assist 1.4.1 bauen
on: { workflow_dispatch: {}, push: { branches: [ main ] } }
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "7.0.x" }
      - run: dotnet restore RhinoContextAssist.csproj
      - run: dotnet build RhinoContextAssist.csproj -c Release --no-restore
      - uses: actions/upload-artifact@v4
        with: { name: RhinoContextAssist-1.4.1, path: bin/Release/net7.0-windows/*, if-no-files-found: error }
